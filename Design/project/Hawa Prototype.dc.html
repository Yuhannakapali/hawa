<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;min-height:100%;background:#DCDFE2;-webkit-font-smoothing:antialiased} a{color:#0D1012} a:hover{opacity:.75}</style>
</helmet>
<div style="min-height:100vh; display:flex; flex-wrap:wrap; gap:40px; align-items:center; justify-content:center; padding:32px 24px; box-sizing:border-box; font-family:'Archivo', system-ui, sans-serif; color:#0D1012;">
  <div style="width:390px; height:844px; max-width:100%; border-radius:40px; overflow:hidden; flex-shrink:0; background:{{ bg }}; box-shadow:0 0 0 10px #0D1012, 0 30px 60px -20px rgba(0,0,0,.45);">
    <dc-import name="HawaApp" screen="{{ screen }}" state="{{ net }}" theme="{{ theme }}" level="{{ level }}" hint-size="100%,100%" style="display:block; width:100%; height:100%;"></dc-import>
  </div>
  <div style="max-width:300px; display:flex; flex-direction:column; gap:10px; font-size:15px; line-height:1.5; color:#4A535B;">
    <div style="font-size:22px; font-weight:800; color:#0D1012;">Hawa prototype</div>
    <div>Tap through it: onboarding, then the list, map, site detail (tap any hour), wind by height and settings.</div>
    <div>Use Tweaks to switch the theme, the network state (loading, error, offline, stale, no favorites) and the starting screen. Retry and Refresh work.</div>
    <a href="Hawa Design Canvas.dc.html">All screens and states →</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;network&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ok&quot;,&quot;loading&quot;,&quot;error&quot;,&quot;offline&quot;,&quot;stale&quot;,&quot;empty&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;start&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;onboarding&quot;,&quot;home&quot;,&quot;detail&quot;,&quot;wind&quot;,&quot;settings&quot;,&quot;landing&quot;],&quot;default&quot;:&quot;onboarding&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pilot&quot;,&quot;student&quot;],&quot;default&quot;:&quot;pilot&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    return { theme, bg: theme === 'dark' ? '#08090A' : '#F4F5F6', screen: this.props.start ?? 'onboarding', net: this.props.network ?? 'ok', level: this.props.level ?? 'pilot' };
  }
}
</script>
</body>
</html>
